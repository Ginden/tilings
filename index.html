<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aperiodic tilings — Penrose and friends</title>
    <meta
      name="description"
      content="Generate Penrose and other aperiodic tilings as SVG, recolour them and download them as SVG or PNG."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aperiodic tilings — Penrose and friends" />
    <meta
      property="og:description"
      content="Generate, recolour and export Penrose and other aperiodic tilings directly in your browser."
    />
    <meta property="og:image" content="./social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A blue and gold Penrose rhomb tiling" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aperiodic tilings — Penrose and friends" />
    <meta
      name="twitter:description"
      content="Generate, recolour and export Penrose and other aperiodic tilings directly in your browser."
    />
    <meta name="twitter:image" content="./social-preview.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="stage" aria-label="Tiling preview"></main>

    <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel">
      <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
        <path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2Z" />
      </svg>
      <span class="sr-only">Toggle controls</span>
    </button>

    <noscript>
      <section class="no-script" aria-labelledby="no-script-title">
        <h1 id="no-script-title">JavaScript is required</h1>
        <p>This app generates tilings in your browser, so it cannot run without JavaScript.</p>
      </section>
    </noscript>

    <form id="panel" aria-label="Tiling controls">
      <header>
        <p class="panel-kicker">Aperiodic tilings</p>
        <h1 id="tiling-name"></h1>
        <div id="tiling-description" class="tiling-description"></div>
        <section class="tiling-references" aria-labelledby="tiling-references-title">
          <h2 id="tiling-references-title">References</h2>
          <ul id="tiling-reference-list"></ul>
        </section>
      </header>

      <fieldset>
        <legend>Tiling</legend>
        <label for="tiling">Type</label>
        <select id="tiling" name="tiling"></select>
      </fieldset>

      <fieldset>
        <legend>Colours</legend>
        <div id="palettes" class="palettes" role="group" aria-label="Preset palettes"></div>

        <div class="colour-pair">
          <div class="row">
            <label for="colour1">Colour 1</label>
            <input type="color" id="colour1" />
            <input type="text" id="colour1-hex" class="hex" spellcheck="false" aria-label="Colour 1 hex value" />
          </div>

          <div class="row">
            <label for="colour2">Colour 2</label>
            <input type="color" id="colour2" />
            <input type="text" id="colour2-hex" class="hex" spellcheck="false" aria-label="Colour 2 hex value" />
          </div>
          <button id="swap-colours" class="icon-button" type="button" aria-label="Swap colours 1 and 2" title="Swap colours 1 and 2">
            <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M7 7 12 12 7 17v-4H2v-2h5V7m10 0v4h5v2h-5v4l-5-5 5-5Z" />
            </svg>
          </button>
        </div>
        <div id="colour3-controls" hidden>
          <div class="row">
            <label for="colour3-enabled">Use third colour</label>
            <input type="checkbox" id="colour3-enabled" />
          </div>
          <div class="row">
            <label for="colour3">Colour 3</label>
            <input type="color" id="colour3" />
            <input type="text" id="colour3-hex" class="hex" spellcheck="false" aria-label="Colour 3 hex value" />
          </div>
        </div>
        <p class="hint" id="kind-hint"></p>

        <div class="row">
          <label for="border">Border</label>
          <input type="color" id="border" />
          <input type="text" id="border-hex" class="hex" spellcheck="false" aria-label="Border hex value" />
        </div>
        <div class="row">
          <label for="border-transparent">Transparent border</label>
          <input type="checkbox" id="border-transparent" />
        </div>
        <div class="row">
          <label for="border-width">Border width</label>
          <input type="range" id="border-width" min="0.1" max="6" step="0.1" value="1" />
          <output id="border-width-value">1.0</output>
        </div>
      </fieldset>

      <fieldset>
        <legend>Canvas</legend>
        <label for="size">Screen size</label>
        <select id="size"></select>
        <div class="row" id="custom-size" hidden>
          <label for="custom-width">Width</label>
          <input type="number" id="custom-width" min="64" max="16384" step="1" />
          <label for="custom-height">Height</label>
          <input type="number" id="custom-height" min="64" max="16384" step="1" />
        </div>

        <div class="row">
          <label for="tile-size">Tile size</label>
          <input type="range" id="tile-size" min="8" max="200" step="1" value="42" />
          <output id="tile-size-value">42 px</output>
        </div>

        <div class="row">
          <label for="rotation">Rotation</label>
          <input type="range" id="rotation" min="0" max="359" step="1" value="0" />
          <output id="rotation-value">0°</output>
        </div>
      </fieldset>

      <fieldset>
        <legend>Export</legend>
        <div class="buttons">
          <button type="button" id="download-svg">Download SVG</button>
          <button type="button" id="download-png">Download PNG</button>
        </div>
        <p class="hint" id="status"></p>
      </fieldset>

      <footer class="credits">
        By <a href="https://michalwadas.pl" rel="author">Michał Wadas</a>
        · <a href="https://github.com/Ginden" rel="noreferrer">GitHub</a>
      </footer>
    </form>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
